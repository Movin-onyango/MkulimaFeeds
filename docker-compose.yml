services:

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mkulimafeeds_db}
      POSTGRES_USER: ${DB_USER:-mkulimafeeds_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      # FIXED name — never changes regardless of folder name
      - mkulimafeeds_pgdata:/var/lib/postgresql
      # Auto-seed on first init (only runs if the volume is empty)
      - ./backend/seed/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mkulimafeeds_app} -d ${DB_NAME:-mkulimafeeds_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mkulimafeeds-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mkulimafeeds_db}
      DB_USER: ${DB_USER:-mkulimafeeds_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      EMAIL_FROM: ${EMAIL_FROM:-MkulimaFeeds <onboarding@resend.dev>}
      AT_USERNAME: ${AT_USERNAME:-sandbox}
    volumes:
      # Bind-mount the repo's uploads folder — images are committed to git
      - ./backend/uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - mkulimafeeds-net

volumes:
  mkulimafeeds_pgdata:
    name: mkulimafeeds_pgdata     # ← explicit — never auto-prefixed

networks:
  mkulimafeeds-net:
    driver: bridge